name: Finalize Trader OS v3.0.2 validated

on:
  push:
    branches: [v3.0.2-ready]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.0.2-ready
          fetch-depth: 0

      - name: Apply v3.0.2 changes
        shell: bash
        run: |
          sed -n "/python3 - <<'PY'/,/^[[:space:]]*PY$/p" .github/workflows/build-v3.0.2-ready.yml | sed '1d;$d;s/^          //' > /tmp/apply_v302.py
          python3 /tmp/apply_v302.py
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('server/package.json'),Path('web/package.json')]:
              s=p.read_text()
              s=s.replace('"@trader-os/shared": "3.0.1"','"@trader-os/shared": "3.0.2"')
              p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, test and build
        shell: bash
        run: |
          npm install
          mkdir -p "$RUNNER_TEMP/trader-data"
          DATA_DIR="$RUNNER_TEMP/trader-data" npm test
          DATA_DIR="$RUNNER_TEMP/trader-data" npm run build

      - name: Commit clean full source
        shell: bash
        run: |
          rm -rf .github/workflows .v302-trigger .v302-trigger-2 .v302-trigger-3
          git config user.name "Trader OS Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Trader OS v3.0.2 validated ready source"
          git push origin HEAD:v3.0.2-ready
