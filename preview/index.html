async function loadBase(silent=true){
  D=await api('/api/dashboard',{silent});
  opp=D.opportunitySnapshot||opp;
  const pill=$('statusPill');
  if(pill)pill.innerHTML=`<span class=green>●</span> ${D.mode==='LIVE'?'נתוני שוק מחוברים':'מצב הדגמה'} · ${he('session',D.market?.status)}`;
  try{await api('/api/live-prices/subscribe',{method:'POST',body:JSON.stringify({symbols:trackedSymbols()}),silent:true,timeoutMs:8000})}catch{}
  if(view==='dashboard')renderDashboard();
  startLiveUi();
  const fm=D.scanner?.fullMarket||{};
  if(fm.workerActive&&!fm.completedAt)monitorFullMarketScan();
  return D;
}

async function go(id){
  const target=$('view-'+id),p=pages.find(x=>x[0]===id);
  if(!target||!p){toast('המסך שביקשת אינו זמין.','bad');return}
  view=id;
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  target.classList.add('active');
  $('pageTitle').textContent=p[2];
  $('pageSub').textContent=p[3];
  renderNav();
  if(id!=='dashboard')target.innerHTML=skeleton();
  try{
    if(id==='dashboard'){if(!Object.keys(D).length){target.innerHTML=skeleton();await loadBase(true)}else renderDashboard()}
    if(id==='opportunities'){opp=opp||await api('/api/opportunities/strategy',{silent:true,timeoutMs:15000});renderOpp()}
    if(id==='trades'){ledger=(await api('/api/trades/ledger',{silent:true,timeoutMs:15000})).trades||[];renderTrades()}
    if(id==='watch'){automation=await api('/api/automation',{silent:true,timeoutMs:15000});renderWatch()}
    if(id==='market'){[calendar,brief]=await Promise.all([api('/api/calendar',{silent:true,timeoutMs:15000}),api('/api/market-brief',{silent:true,timeoutMs:15000})]);renderMarket()}
    if(id==='portfolio'){intel=await api('/api/portfolio/intelligence',{silent:true,timeoutMs:15000});renderPortfolio()}
    if(id==='journal'){journal=await api('/api/journal',{silent:true,timeoutMs:15000});renderJournal()}
    if(id==='alerts'){alerts=await api('/api/alerts',{silent:true,timeoutMs:15000});automation=await api('/api/automation',{silent:true,timeoutMs:15000});renderAlerts()}
    if(id==='broker'){broker=await api('/api/broker',{silent:true,timeoutMs:15000});renderBroker()}
    if(id==='console'){history=(await api('/api/console/history',{silent:true,timeoutMs:15000})).messages||[];renderConsole()}
    if(id==='rules'){rules=await api('/api/brain',{silent:true,timeoutMs:15000});renderRules()}
    if(id==='data'){freeData=await api('/api/intelligence/free-status',{silent:true,timeoutMs:15000});renderDataCenter(freeData)}
    if(id==='learning'){renderDecisionLab(await api('/api/decision-lab',{silent:true,timeoutMs:15000}))}
  }catch(e){
    target.innerHTML=ctaEmpty('לא הצלחתי לטעון את המסך',errHe(e),btn('נסה שוב',`go('${id}')`,'primary'));
  }
}

function fullScanEta(fm){const checked=Number(fm?.checked||0),total=Number(fm?.catalogSize||0),start=Date.parse(fm?.startedAt||'');if(!checked||!total||!Number.isFinite(start))return 'מחשב…';if(checked>=total)return 'הושלם';const mins=Math.max(0.1,(Date.now()-start)/60000),rate=checked/mins;if(!rate||!Number.isFinite(rate))return 'מחשב…';const left=(total-checked)/rate;if(left<1)return 'פחות מדקה';if(left<60)return `כ-${Math.ceil(left)} דק׳`;return `כ-${(left/60).toFixed(1)} שעות`}

function monitorFullMarketScan(){stopFullScanUiMonitor();const tick=async()=>{try{D.scanner=await api('/api/scanner/status',{silent:true,timeoutMs:8000});const fm=D.scanner?.fullMarket||{};if(view==='opportunities')renderOpp();if(view==='dashboard')renderDashboard();if(view==='alerts')renderAlerts();if(fm.completedAt){stopFullScanUiMonitor();const msg=fm.completedWithErrors?`סבב השוק הסתיים עם ${fm.failures} מניות שלא התקבל עליהן Quote תקין. ההזדמנויות ידורגו מהנתונים שהושלמו בהצלחה.`:`סריקת השוק הסתיימה בהצלחה: ${fm.successes}/${fm.catalogSize}.`;toast(msg,fm.completedWithErrors?'bad':'good');try{await refreshOpp(false)}catch{}}}catch{}};void tick();fullScanUiTimer=setInterval(tick,3000)}

function thesisHe(v){return v==='VALID'?'תקפה':v==='WEAKENING'?'נחלשת':v==='INVALIDATED'?'נפסלה':'לא ידוע'}function trailHe(v){return v==='BREAKEVEN'?'נקודת איזון':v==='ATR'?'Trailing לפי ATR':v==='STRUCTURE'?'Trailing לפי מבנה מחיר':'ללא Trailing'}function renderTrades(){const trades=[...(D.activeTrades||[])].sort((a,b)=>{const pa=livePrices[a.symbol]?.price??a.current,pb=livePrices[b.symbol]?.price??b.current,da=pa&&a.stop?Math.abs((pa-a.stop)/pa):99,db=pb&&b.stop?Math.abs((pb-b.stop)/pb):99;return da-db});$('view-trades').innerHTML=tabGuide('עסקאות פתוחות','חדר העבודה של הפוזיציות: מחיר חי, סיכון, Stop/TP, תזה ומימושים. העסקאות הקרובות ביותר לסטופ מופיעות ראשונות.','מיד אחרי כניסה בפועל, וגם כשרוצים לפתוח עסקה ידנית שלא הופיעה בסריקה.','מחיר חי, R, מרחק לסטופ, האם יעד נפגע והאם מחיר היציאה בברוקר כבר אומת.')+`<div class="hero liveHero"><div class=row>${tag('מחיר חי','green')}${tag('מעקב TP / Stop','blue')}${tag('פתיחה ידנית','amber')}</div><h2>חדרי העסקאות שלך</h2><p>המעקב המקומי יכול לזהות נגיעה ב-Stop/TP, אבל Fill אמיתי תמיד דורש דיווח או אימות מול IBI.</p><div class=row>${btn('+ פתח עסקה ידנית','openManualTrade()','primary')}${btn('רענן תצוגת עסקאות',"loadBase(true).then(()=>{renderTrades();pollLive()})")}</div></div><div class="grid cards">${trades.map(t=>{const lp=livePrices[t.symbol]?.price??t.current,pnl=sidePnl(t,lp),auto=t.autoLevelManagement!==false,dist=lp&&t.stop?Math.abs((lp-t.stop)/lp*100):null,urgent=dist!=null&&dist<2;return `<div class="card ${urgent?'urgent':''}"><div class=row><h3 class=ltr>${t.symbol}</h3><div class=spacer></div>${urgent?tag('קרובה לסטופ','red'):''}${tag(he('execution',t.executionState),t.executionState==='RECORDED'?'green':'amber')}${tag(thesisHe(t.thesisStatus),t.thesisStatus==='INVALIDATED'?'red':t.thesisStatus==='WEAKENING'?'amber':'green')}</div><div class=kv><div><small>כניסה</small>${money(t.entry)}</div><div><small>מחיר חי</small>${liveSymbolEl(t.symbol,t.current)}</div><div><small>כמות שנותרה</small>${t.quantity??0}</div><div><small>P&L משוער</small><span class="${pnl==null?'':pnl>=0?'green':'red'}" data-pnl-symbol="${esc(t.symbol)}">${pnl==null?'—':money(pnl)}</span></div><div><small>סטופ</small>${money(t.stop)}</div><div><small>מרחק לסטופ</small>${dist==null?'—':dist.toFixed(2)+'%'}</div><div><small>יעד 1</small>${money(t.tp1)}</div><div><small>יעד 2</small>${money(t.tp2)}</div></div><div class=autoMonitor><div class=row><b>מעקב רמות</b><div class=spacer></div>${tag(auto?'פעיל':'כבוי',auto?'green':'amber')}</div><div class=gates>${t.tp1HitAt?tag('✓ יעד 1','green'):tag('TP1 ממתין')}${t.tp2HitAt?tag('✓ יעד 2','green'):''}${t.stopHitAt?tag('⚠ סטופ נפגע','red'):''}</div></div><div class=row style="margin-top:12px">${btn('פתח חדר עסקה',`openTradeRoom('${t.id}')`,'primary')}${t.executionState==='PLANNED'?btn('רשום ביצוע אמיתי',`fillTrade('${t.id}','${t.symbol}')`,'blue'):''}${btn('בנה פקודות IBI',`stage('${t.id}')`)}${t.executionState==='RECORDED'?btn('סגור עסקה',`closeTradeUi('${t.id}','${t.symbol}')`,'danger'):''}</div></div>`}).join('')||ctaEmpty('אין כרגע עסקאות פתוחות','אפשר לפתוח כל מניה ידנית — אין תלות בסורק.',btn('+ פתח עסקה ידנית','openManualTrade()','primary'))}</div><div class=panel style="margin-top:18px"><div class=head><h3>היסטוריית עסקאות אחרונות</h3><div class=spacer></div>${tag('רק Fill מאומת מזין למידה אמיתית','blue')}</div><div class=body>${ledger.length?`<div class=tableWrap><table class=table><tr><th>מניה</th><th>סיבה</th><th>יציאה</th><th>P&L</th><th>R</th><th>אימות ברוקר</th><th></th></tr>${ledger.slice(0,20).map(c=>`<tr><td><b class=ltr>${c.symbol}</b></td><td>${c.closeReason==='STOP_HIT'?'סטופ נפגע':c.closeReason==='TP2_HIT'?'יעד 2 הושג':'סגירה ידנית'}</td><td>${money(c.exitPrice)}</td><td class="${(c.realizedPnlUsd??0)>=0?'green':'red'}">${money(c.realizedPnlUsd)}</td><td>${c.realizedR??'—'}R</td><td>${c.closureSource==='LEVEL_MONITOR'&&c.brokerExecutionConfirmed===false?tag('ממתין לאימות','amber'):tag('מאומת / דווח ידנית','green')}</td><td>${c.closureSource==='LEVEL_MONITOR'&&c.brokerExecutionConfirmed===false?btn('אמת ביצוע',`confirmClosedFill('${c.id}','${c.symbol}',${c.exitPrice??'null'})`,'blue'):''}</td></tr>`).join('')}</table></div>`:empty('אין עדיין עסקאות סגורות')}</div></div>`;updateLiveDom()}
function closeManualTrade(){document.getElementById('manualTradeOverlay')?.remove()}function openManualTrade(){closeManualTrade();const html=`<div id=manualTradeOverlay class=decisionOverlay onclick="if(event.target.id==='manualTradeOverlay')closeManualTrade()"><div class=decisionModal style="width:min(780px,100%)"><div class="decisionHeader wait"><div class=row>${tag('עסקה ידנית','blue')}<div class=spacer></div>${btn('סגור','closeManualTrade()')}</div><h2>פתח עסקה בעצמך</h2><p>לא חייבים שהמניה תופיע בסורק. הזן סימבול ורמות שאתה בוחר; המערכת תחשב גודל פוזיציה וסיכון ותתחיל לעקוב אחר המחיר.</p></div><div class=decisionBody><div class=manualTradeGrid><div class=field><label>סימבול</label><input id=manualSymbol class=ltr placeholder="AAPL" oninput="this.value=this.value.toUpperCase()"></div><div class=field><label>כיוון</label><select id=manualSide><option value=LONG>לונג</option><option value=SHORT>שורט</option></select></div><div class=field><label>מחיר כניסה</label><input id=manualEntry type=number step=0.01 placeholder="יטען מהמחיר החי"></div><div class=field><label>סטופ</label><input id=manualStop type=number step=0.01></div><div class=field><label>יעד 1</label><input id=manualTp1 type=number step=0.01></div><div class=field><label>יעד 2</label><input id=manualTp2 type=number step=0.01></div><div class=field><label>סיכון לעסקה (%)</label><input id=manualRisk type=number step=0.1 value="0.5"></div><div class=field><label>סטטוס</label><select id=manualExecution><option value=RECORDED>כבר קניתי / מכרתי בפועל</option><option value=PLANNED>תוכנית בלבד</option></select></div></div><div class=field style="margin-top:12px"><label>למה פתחת את העסקה?</label><textarea id=manualThesis placeholder="לדוגמה: פריצה מעל התנגדות עם נפח חזק…"></textarea></div><label class=row style="margin-top:12px"><input id=manualAuto type=checkbox checked> <span>הפעל מעקב אוטומטי אחרי Stop / TP1 / TP2</span></label><div id=manualPreview class=manualSummary style="margin-top:14px">הזן סימבול וסטופ ולחץ “טען מחיר וחישוב סיכון”.</div><div class=row style="margin-top:14px">${btn('טען מחיר וחישוב סיכון','previewManualTrade()','blue')}${btn('פתח עסקה','submitManualTrade()','primary')}</div><p class=sub style="margin-top:12px">חשוב: אם תבחר “בוצעה בפועל”, זהו רישום של ביצוע שאתה מדווח עליו. Trader OS לא שולחת את הפקודה ל-IBI. סגירת מעקב אוטומטית ב-Stop/TP2 מבוססת על נגיעת מחיר ואינה אישור Fill מהברוקר.</p></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html)}async function previewManualTrade(){const sym=$('manualSymbol').value.trim().toUpperCase();if(!sym)return toast('הזן סימבול.','bad');const side=$('manualSide').value,stop=Number($('manualStop').value),entry=Number($('manualEntry').value)||undefined,riskPct=Number($('manualRisk').value)||0.5;try{const x=await api('/api/trades/manual/preview',{method:'POST',body:JSON.stringify({symbol:sym,side,entry,stop,riskPct}),loadingLabel:'טוען מחיר ומחשב סיכון…',loadingDetail:'מושך Quote עדכני ומחשב Risk Budget וגודל פוזיציה.'});$('manualEntry').value=Number(x.entry).toFixed(2);$('manualPreview').innerHTML=`<div class=row><b class=ltr>${esc(sym)}</b><div class=spacer></div>${tag('מחיר '+money(x.entry),'green')}</div><div class=kv style="margin-top:8px"><div><small>תקציב סיכון</small>${money(x.riskBudgetUsd)}</div><div><small>סיכון למניה</small>${money(x.riskPerShareUsd)}</div><div><small>כמות מוצעת</small><b id=manualQty>${x.suggestedQuantity||0}</b></div><div><small>שווי פוזיציה</small>${money(x.estimatedPositionValueUsd)}</div></div>${!x.suggestedQuantity?'<div class="notice dangerBox" style="margin-top:8px">לא ניתן לחשב כמות בלי סטופ תקין. אפשר לבחור כמות ידנית בשלב הבא.</div>':''}`;await api('/api/live-prices/subscribe',{method:'POST',body:JSON.stringify({symbols:[sym]}),silent:true});startLiveUi()}catch(e){toast('לא הצלחתי לטעון את המניה: '+errHe(e),'bad')}}
async function submitManualTrade(){const symbol=$('manualSymbol').value.trim().toUpperCase(),side=$('manualSide').value,entry=Number($('manualEntry').value),stop=Number($('manualStop').value),tp1=Number($('manualTp1').value)||undefined,tp2=Number($('manualTp2').value)||undefined,executionState=$('manualExecution').value,thesis=$('manualThesis').value.trim()||'עסקה ידנית',autoLevelManagement=$('manualAuto').checked;let quantity=Number(document.getElementById('manualQty')?.textContent||0);if(!symbol||!entry||!stop)return toast('חובה למלא סימבול, מחיר כניסה וסטופ.','bad');if(!quantity){const q=await askForm('כמות ידנית','לא ניתן היה לחשב כמות אוטומטית. הזן את מספר המניות שאתה רוצה לרשום.',[{name:'quantity',label:'כמות מניות',type:'number',step:'1'}],'המשך');if(!q)return;quantity=Math.floor(Number(q.quantity));if(!(quantity>0))return toast('הכמות אינה תקינה.','bad')}if(!tp1&&!tp2&&!await askConfirm('להמשיך בלי יעד?','לא הוגדר TP1 או TP2. העסקה תוכל להיפתח, אבל המערכת לא תוכל לנטר יעד רווח מוגדר.','המשך בלי יעד'))return;try{const x=await api('/api/trades/open',{method:'POST',body:JSON.stringify({symbol,side,entry,quantity,stop,tp1,tp2,thesis,executionState,autoLevelManagement,analyze:false}),loadingLabel:'פותח עסקה ידנית…',loadingDetail:'בודק סיכון, שומר את העסקה ומצרף אותה למעקב המחיר.'});closeManualTrade();await loadBase(true);renderTrades();toast(`${symbol} נוספה לעסקאות הפתוחות.`);setTimeout(()=>openTradeRoom(x.id),250)}catch(e){toast('לא ניתן לפתוח את העסקה: '+errHe(e),'bad')}}
async function fillTrade(id,sym){const x=await askForm(`רישום ביצוע אמיתי — ${sym}`,'הזן בדיוק את ה-Fill שקיבלת בברוקר. זה הופך תוכנית לפוזיציה שבוצעה.',[{name:'entry',label:'מחיר ביצוע',type:'number',step:'0.01'},{name:'quantity',label:'כמות שבוצעה',type:'number',step:'1'}],'רשום ביצוע');if(!x)return;if(!(Number(x.entry)>0)||!(Number(x.quantity)>0))return toast('מחיר וכמות חייבים להיות חיוביים.','bad');await api(`/api/trades/open/${id}/fill`,{method:'POST',body:JSON.stringify({entry:Number(x.entry),quantity:Number(x.quantity)}),loadingLabel:'רושם ביצוע אמיתי…',loadingDetail:'מעדכן כמות, מחיר כניסה, סיכון וציר זמן.'});await loadBase(true);renderTrades();await openTradeRoom(id)}
async function closeTradeUi(id,sym){const x=await askForm(`סגירת עסקה — ${sym}`,'הזן את מחיר היציאה האמיתי מהברוקר. הנתון ישמש לחישוב P&L ו-R.',[{name:'exitPrice',label:'מחיר יציאה',type:'number',step:'0.01'},{name:'followedPlan',label:'פעלתי לפי התוכנית המקורית',type:'checkbox',value:true},{name:'notes',label:'הערה לסגירה',type:'textarea',placeholder:'מה קרה בעסקה?'}],'סגור עסקה');if(!x)return;if(!(Number(x.exitPrice)>0))return toast('מחיר היציאה אינו תקין.','bad');await api(`/api/trades/open/${id}/close`,{method:'POST',body:JSON.stringify({exitPrice:Number(x.exitPrice),followedPlan:Boolean(x.followedPlan),notes:x.notes}),loadingLabel:'סוגר עסקה ורושם ביומן…',loadingDetail:'מחשב P&L ומעביר את העסקה ל-Ledger.'});closeTradeRoom();await loadBase(true);ledger=(await api('/api/trades/ledger',{silent:true})).trades||[];renderTrades()}
async function confirmClosedFill(id,sym,observed){const x=await askForm(`אימות ביצוע IBI — ${sym}`,'Trader OS זיהתה נגיעה ברמה וסגרה את המעקב המקומי. עכשיו צריך את מחיר היציאה האמיתי מהברוקר לפני שהעסקה נכנסת ללמידה.',[{name:'exitPrice',label:'מחיר יציאה אמיתי',type:'number',step:'0.01',value:observed??''}],'אמת ביצוע');if(!x||!(Number(x.exitPrice)>0))return;try{await api(`/api/trades/closed/${id}/confirm-exit`,{method:'POST',body:JSON.stringify({exitPrice:Number(x.exitPrice)}),loadingLabel:'מאמת ביצוע מול הברוקר…',loadingDetail:'מעדכן P&L, R ומסמן את העסקה כראויה ללמידה.'});ledger=(await api('/api/trades/ledger',{silent:true})).trades||[];renderTrades();toast(`${sym}: מחיר היציאה אומת והביצועים עודכנו.`)}catch(e){toast('לא ניתן לאמת את הביצוע: '+errHe(e),'bad')}}
async function openTradeRoom(id,silent=false){currentTradeRoomId=id;let x;if(silent){x=await api(`/api/trades/open/${id}/management`,{silent:true,timeoutMs:7000});try{const cache=await api('/api/trades/thesis',{silent:true,timeoutMs:5000}),t=(cache.monitors||[]).find(z=>z.tradeId===id);if(t)x.thesisMonitor=t}catch{}}else{const [m,t]=await Promise.all([api(`/api/trades/open/${id}/management`,{loadingLabel:'פותח חדר עסקה…',loadingDetail:'מחשב R, P&L, סיכון ומצב ניהול.'}),api(`/api/trades/open/${id}/thesis-check`,{method:'POST',body:'{}',silent:true,timeoutMs:45000}).catch(()=>undefined)]);x=m;if(t)x.thesisMonitor=t}showTradeRoom(x)}
function closeTradeRoom(){currentTradeRoomId=null,coachData=null,alertFilter='ALL',freeData=null;document.getElementById('tradeRoomOverlay')?.remove()}
function showTradeRoom(x){document.getElementById('tradeRoomOverlay')?.remove();currentTradeRoomId=x.tradeId;const pnl=x.unrealizedPnlUsd,rec=x.executionState==='RECORDED',tm=x.thesisMonitor||{},tmTone=tm.status==='INVALIDATED'?'red':tm.status==='WEAKENING'?'amber':'green',partials=(x.partialExits||[]).map(p=>`<div class=checkRow><span>${time(p.at)} · ${p.quantity} מניות ב-${money(p.price)} · <b class="${p.pnlUsd>=0?'green':'red'}">${money(p.pnlUsd)}</b>${p.note?` · ${esc(p.note)}`:''}</span></div>`).join('')||'<div class=sub>עדיין לא נרשמו מימושים חלקיים.</div>',timeline=(x.timeline||[]).map(t=>`<div class=timelineItem><b>${time(t.at)}</b><div class=sub>${esc(t.message)}</div></div>`).join('')||'<div class=sub>אין עדיין אירועים בציר הזמן.</div>';const html=`<div id=tradeRoomOverlay class=decisionOverlay onclick="if(event.target.id==='tradeRoomOverlay')closeTradeRoom()"><div class=decisionModal><div class="decisionHeader ${x.action==='VERIFY_STOP'||tm.status==='INVALIDATED'?'bad':x.action==='TP1_REACHED'||x.action==='TP2_REACHED'?'good':'wait'}"><div class=row>${tag(x.actionLabel||'ניהול עסקה',x.action==='VERIFY_STOP'?'red':x.action?.includes('TP')?'green':'amber')}${tm.status?tag('תזה '+thesisHe(tm.status),tmTone):''}<div class=spacer></div>${tag(rec?'בוצעה בפועל':'תוכנית בלבד',rec?'green':'amber')}${btn('סגור','closeTradeRoom()')}</div><h2><span class=ltr>${esc(x.symbol)}</span> — חדר עסקה חי</h2><p>${esc(tm.recommendedAction||x.reason||'')}</p></div><div class=decisionBody><div class=tradeRoomGrid><div><small>מחיר חי</small><b>${liveSymbolEl(x.symbol,x.price)}</b></div><div><small>R נוכחי</small><b class="${(x.currentR??0)>=0?'green':'red'}">${x.currentR??'—'}R</b></div><div><small>P&L לא ממומש</small><b class="${(pnl??0)>=0?'green':'red'}">${pnl==null?'—':money(pnl)}</b></div><div><small>מומש חלקית</small><b>${money(x.partialRealizedPnlUsd??0)}</b></div><div><small>כמות שנותרה</small><b>${x.quantity??0} / ${x.initialQuantity??x.quantity??0}</b></div><div><small>סיכון שנותר</small><b>${money(x.riskUsd)} ${x.riskPct!=null?`(${x.riskPct}%)`:''}</b></div><div><small>מרחק מהסטופ</small><b>${x.stopDistancePct??'—'}%</b></div><div><small>מרחק מיעד 1</small><b>${x.tp1DistancePct??'—'}%</b></div><div><small>MFE</small><b>${x.mfePct??'—'}%</b></div><div><small>MAE</small><b>${x.maePct??'—'}%</b></div><div><small>Trailing</small><b>${trailHe(x.trailingMode)}</b></div><div><small>מעקב Stop/TP</small><b>${x.autoLevelManagement===false?'כבוי':'פעיל'}</b></div></div>${tm.status?`<div class="panel" style="margin-top:14px"><div class=head><h3>Thesis Monitor — האם הסיבה לעסקה עדיין קיימת?</h3><div class=spacer></div>${tag(thesisHe(tm.status),tmTone)}${tm.score!=null?tag(tm.score+'/100','blue'):''}</div><div class=body>${(tm.reasons||[]).map(r=>`<div class=checkRow><span class="checkIcon ${tm.status==='INVALIDATED'?'fail':tm.status==='WEAKENING'?'amber':'good'}">${tm.status==='VALID'?'✓':'!'}</span><span>${esc(r)}</span></div>`).join('')}${(tm.changes||[]).length?`<div class=explainBox><strong>מה השתנה?</strong>${tm.changes.map(c=>esc(c)).join(' · ')}</div>`:''}<div class=row style="margin-top:10px">${btn('בדוק תזה מחדש',`refreshTradeThesis('${x.tradeId}')`,'blue')}</div></div></div>`:''}<div class=decisionSection><h3>רמות העסקה</h3><div class=decisionLevels><div><small>כניסה</small><b>${money(x.entry)}</b></div><div><small>סטופ</small><b>${money(x.stop)}</b></div><div><small>סטופ מקורי</small><b>${money(x.originalStop)}</b></div><div><small>יעד 1</small><b>${money(x.tp1)}</b></div><div><small>יעד 2</small><b>${money(x.tp2)}</b></div></div></div><div class=decisionSection><h3>פעולות ניהול</h3>${x.suggestedStop?`<div class="explainBox goodBox"><strong>הצעת סטופ חדשה</strong>${money(x.suggestedStop)} — הצעה בלבד, לא בוצעה ב-IBI.</div>`:''}<div class=actionGrid>${!rec?btn('רשום ביצוע אמיתי',`closeTradeRoom();fillTrade('${x.tradeId}','${x.symbol}')`,'primary'):''}${rec&&x.suggestedStop?btn('החל סטופ מוצע',`applySuggestedStop('${x.tradeId}',${x.suggestedStop})`,'blue'):''}${rec?btn('מימוש חלקי',`partialExitUi('${x.tradeId}')`,'blue'):''}${rec?btn('Break-even',`breakevenUi('${x.tradeId}')`):''}${rec?btn('שנה סטופ',`moveStopUi('${x.tradeId}',${x.stop??'null'})`):''}${rec?btn('Trailing',`trailingUi('${x.tradeId}')`):''}${btn('עדכן תזה',`thesisUi('${x.tradeId}')`)}${btn(x.autoLevelManagement===false?'הפעל מעקב רמות':'כבה מעקב רמות',`toggleAutoLevel('${x.tradeId}',${x.autoLevelManagement===false?'true':'false'})`)}${btn('הוסף הערה',`noteTradeUi('${x.tradeId}')`)}${btn('בנה פקודות IBI',`stage('${x.tradeId}')`)}${rec?btn('סגור עסקה',`closeTradeRoom();closeTradeUi('${x.tradeId}','${x.symbol}')`,'danger'):''}</div><p class=sub>Trader OS מנהלת את ה-state המקומי בלבד. נגיעת Stop/TP אינה הוכחת Fill בברוקר עד אימות.</p></div><div class=decisionGrid><div class=panel><div class=head><h3>מימושים חלקיים</h3></div><div class=body>${partials}</div></div><div class=panel><div class=head><h3>ציר הזמן</h3></div><div class="body timeline">${timeline}</div></div></div></div></div></div>`;document.body.insertAdjacentHTML('beforeend',html)}
async function refreshTradeThesis(id){try{const t=await api(`/api/trades/open/${id}/thesis-check`,{method:'POST',body:'{}',loadingLabel:'בודק את התזה מחדש…',loadingDetail:'משווה מחיר, שוק, סקטור, RS, RVOL, נתונים ו-SEC מול הסיבה המקורית לעסקה.'});const m=await api(`/api/trades/open/${id}/management`,{silent:true});m.thesisMonitor=t;showTradeRoom(m)}catch(e){toast('בדיקת התזה נכשלה: '+errHe(e),'bad')}}
async function toggleAutoLevel(id,enabled){await api(`/api/trades/open/${id}`,{method:'PATCH',body:JSON.stringify({autoLevelManagement:enabled}),loadingLabel:enabled?'מפעיל מעקב רמות…':'מכבה מעקב רמות…'});await loadBase();await openTradeRoom(id)}async function partialExitUi(id){const x=await askForm('מימוש חלקי','רשום רק ביצוע שבאמת בוצע בברוקר.',[{name:'quantity',label:'כמות שמומשה',type:'number',step:'1'},{name:'price',label:'מחיר ביצוע',type:'number',step:'0.01'},{name:'note',label:'הערה',type:'textarea'}],'רשום מימוש');if(!x)return;await api(`/api/trades/open/${id}/partial-exit`,{method:'POST',body:JSON.stringify({quantity:Number(x.quantity),price:Number(x.price),note:x.note}),loadingLabel:'רושם מימוש חלקי…',loadingDetail:'מעדכן כמות שנותרה, P&L ממומש וסיכון שנותר.'});await loadBase(true);await openTradeRoom(id)}

async function moveStopUi(id,current){const x=await askForm('שינוי סטופ','המערכת תחסום שינוי שמרחיב סיכון כברירת מחדל.',[{name:'stop',label:'סטופ חדש',type:'number',step:'0.01',value:current??''},{name:'reason',label:'למה משנים?',type:'textarea',value:'עדכון ידני מחדר העסקה'}],'עדכן סטופ');if(!x)return;try{await api(`/api/trades/open/${id}/move-stop`,{method:'POST',body:JSON.stringify({stop:Number(x.stop),reason:x.reason}),loadingLabel:'מעדכן סטופ…',loadingDetail:'בודק שהשינוי אינו מרחיב את הסיכון.'});await loadBase(true);await openTradeRoom(id)}catch(e){toast('לא ניתן לעדכן סטופ: '+(String(e.message).includes('stop_widening_blocked')?'השינוי מרחיב את הסיכון ולכן נחסם.':errHe(e)),'bad')}}

async function trailingUi(id){const x=await askForm('מצב Trailing','בחר איך המערכת תחשב הצעות להידוק סטופ. היא לא מזיזה פקודה בברוקר.',[{name:'mode',label:'שיטת Trailing',type:'select',value:'NONE',options:[{value:'NONE',label:'ללא Trailing'},{value:'BREAKEVEN',label:'נקודת איזון'},{value:'ATR',label:'לפי ATR'},{value:'STRUCTURE',label:'לפי מבנה המחיר'}]}],'שמור');if(!x)return;await api(`/api/trades/open/${id}/trailing`,{method:'POST',body:JSON.stringify({mode:x.mode}),loadingLabel:'מעדכן מצב Trailing…'});await loadBase(true);await openTradeRoom(id)}

async function noteTradeUi(id){const x=await askForm('הוסף הערה לעסקה','ההערה תישמר בציר הזמן.',[{name:'note',label:'הערה',type:'textarea'}],'שמור הערה');if(!x||!x.note)return;await api(`/api/trades/open/${id}/note`,{method:'POST',body:JSON.stringify({note:x.note}),loadingLabel:'שומר הערה…'});await loadBase(true);await openTradeRoom(id)}

function renderWatch(){const w=D.watchlist||[],rulesA=automation?.rules||{},custom=rulesA.custom||[];$('view-watch').innerHTML=tabGuide('מעקב וטריגרים','מניות שמעניינות אותנו אבל עדיין לא מוכנות. אפשר להוסיף ידנית, להגדיר מחיר טריגר ולראות כמה המחיר רחוק ממנו.','כשאתה מחכה לפריצה, Pullback או מחיר מסוים.','למה המניה במעקב, כמה היא רחוקה מהטריגר, ואילו כללים אוטומטיים פעילים.')+`<div class=hero><h2>רשימת מעקב ומנוע טריגרים</h2><p>לא רודפים אחרי מחיר. מגדירים מראש למה מחכים ונותנים למערכת להתריע.</p><div class=row>${btn('+ הוסף מניה למעקב','addWatchUi()','primary')}${btn('+ הוסף טריגר מותאם','addTriggerUi()','blue')}${btn('בדוק את כל הטריגרים','pollNow()')}</div></div><div class=panel><div class=head><h3>מניות במעקב</h3><div class=spacer></div><span class=sub>${w.length} מניות</span></div><div class=body>${w.length?`<div class="grid cards">${w.map(x=>{const p=livePrices[x.symbol]?.price,dist=p&&x.triggerPrice?Math.abs((x.triggerPrice-p)/p*100):null;return `<div class=card><div class=row><h3 class=ltr>${x.symbol}</h3><div class=spacer></div>${tag(x.source==='scanner'?'מהסריקה':x.source==='engine'?'מהמנוע':'ידנית')}</div><p>${esc(x.note||x.reason||'מניה במעקב')}</p><div class=kv><div><small>מחיר חי</small>${liveSymbolEl(x.symbol)}</div><div><small>מחיר טריגר</small>${money(x.triggerPrice)}</div><div><small>תנאי</small>${x.triggerType==='ABOVE'?'מעל המחיר':x.triggerType==='BELOW'?'מתחת למחיר':'לא הוגדר'}</div><div><small>מרחק מהטריגר</small>${dist==null?'—':dist.toFixed(2)+'%'}</div></div><div class=row style="margin-top:10px">${btn('בדוק כניסה עכשיו',`entry('${x.symbol}')`,'primary')}${btn('הסר ממעקב',`removeWatchUi('${x.symbol}')`,'danger')}</div></div>`}).join('')}</div>`:ctaEmpty('רשימת המעקב ריקה','הוסף מניה ידנית או תן לסורק להוסיף מועמדות שממתינות לטריגר.',btn('+ הוסף מניה','addWatchUi()','primary'))}</div></div><div class=panel><div class=head><h3>טריגרים פעילים</h3></div><div class=body>${[...(rulesA.dynamic||[]),...custom].map(r=>`<div class=row style="padding:9px;border-bottom:1px solid var(--line)"><b class=ltr>${r.symbol}</b>${tag(he('trigger',r.kind))}<span>${money(r.price)}</span>${r.note?`<span class=sub>${esc(r.note)}</span>`:''}<div class=spacer></div>${custom.some(x=>x.id===r.id)?btn('מחק',`removeTriggerUi('${r.id}')`,'danger'):tag('נוצר אוטומטית')}</div>`).join('')||ctaEmpty('אין טריגרים פעילים','אפשר להוסיף טריגר מחיר עצמאי או להגדיר טריגר דרך Watchlist.',btn('+ הוסף טריגר','addTriggerUi()','primary'))}</div></div>`;updateLiveDom()}
async function watch(sym,price){await api('/api/watchlist',{method:'POST',body:JSON.stringify({symbol:sym,note:'נוספה מרשימת הסריקה',triggerPrice:price,triggerType:price?'ABOVE':undefined})});await loadBase()}async function entry(sym){try{const x=await api('/api/intelligence/decision?symbol='+encodeURIComponent(sym),{loadingLabel:'בונה תיק החלטה ל-'+sym+'…',loadingDetail:'בודק נתונים, SEC, שורט/FTD, אנלוגים היסטוריים, סתירות, Stress Test ווועדת ראיות.'});showEntryDecision(x)}catch(e){toast('בדיקת הכניסה נכשלה: '+errHe(e),'bad')}}async function addWatchUi(){const x=await askForm('הוסף מניה למעקב','אפשר להגדיר טריגר עכשיו או להשאיר רק הערת מעקב.',[{name:'symbol',label:'סימול',placeholder:'AAPL'},{name:'note',label:'למה המניה מעניינת?',type:'textarea',placeholder:'לדוגמה: ממתין לפריצה מעל התנגדות'},{name:'triggerPrice',label:'מחיר טריגר (אופציונלי)',type:'number',step:'0.01'},{name:'triggerType',label:'תנאי טריגר',type:'select',value:'ABOVE',options:[{value:'ABOVE',label:'המחיר עולה מעל הרמה'},{value:'BELOW',label:'המחיר יורד מתחת לרמה'}]}],'הוסף למעקב');if(!x)return;const symbol=String(x.symbol||'').trim().toUpperCase();if(!symbol)return toast('חובה להזין סימול.','bad');await api('/api/watchlist',{method:'POST',body:JSON.stringify({symbol,note:x.note,triggerPrice:x.triggerPrice?Number(x.triggerPrice):undefined,triggerType:x.triggerPrice?x.triggerType:undefined,reason:x.note}),loadingLabel:'מוסיף למעקב…'});await loadBase(true);automation=await api('/api/automation',{silent:true});renderWatch();toast(`${symbol} נוספה למעקב.`,'good')}
async function removeWatchUi(symbol){if(!await askConfirm('להסיר מהמעקב?',`${symbol} תוסר מה-Watchlist. עסקאות פתוחות לא ייפגעו.`,'הסר'))return;await api('/api/watchlist/'+encodeURIComponent(symbol),{method:'DELETE',loadingLabel:'מסיר מהמעקב…'});await loadBase(true);automation=await api('/api/automation',{silent:true});renderWatch()}
async function addTriggerUi(){const x=await askForm('טריגר מחיר חדש','המערכת תבדוק את הרמה ותתריע כשהמחיר חוצה אותה.',[{name:'symbol',label:'סימול',placeholder:'AAPL'},{name:'kind',label:'סוג הטריגר',type:'select',value:'WATCH_ABOVE',options:[{value:'WATCH_ABOVE',label:'מעל מחיר'},{value:'WATCH_BELOW',label:'מתחת למחיר'}]},{name:'price',label:'מחיר',type:'number',step:'0.01'},{name:'note',label:'הערה',type:'textarea'}],'שמור טריגר');if(!x)return;const symbol=String(x.symbol||'').trim().toUpperCase(),price=Number(x.price);if(!symbol||!(price>0))return toast('חובה להזין סימול ומחיר תקין.','bad');await api('/api/triggers',{method:'POST',body:JSON.stringify({symbol,kind:x.kind,price,note:x.note}),loadingLabel:'שומר טריגר…'});automation=await api('/api/automation',{silent:true});renderWatch()}
async function removeTriggerUi(id){if(!await askConfirm('למחוק את הטריגר?','הכלל המותאם יוסר.','מחק'))return;await api('/api/triggers/'+encodeURIComponent(id),{method:'DELETE',loadingLabel:'מוחק טריגר…'});automation=await api('/api/automation',{silent:true});renderWatch()}

div></div><div class=panel><div class=head><h3>איך שלב היום משפיע עלינו?</h3></div><div class=body>${(phase?.reasons||[]).map(x=>`<div class=checkRow><span class=checkIcon>◷</span><span>${esc(x)}</span></div>`).join('')||empty('אין עדיין Phase analysis')}<div class=notice style="margin-top:10px">בפתיחה דורשים יותר אישור בגלל תנודתיות; באמצע היום נזהרים מפריצות חלשות; לקראת סגירה בודקים אם מומנטום מתחדש או שהשוק עובר לחלוקה.</div></div></div></div><div class=panel><div class=head><h3>אירועים קרובים</h3></div><div class=body>${ev.length?`<div class=tableWrap><table class=table><tr><th>אירוע</th><th>זמן</th><th>השפעה</th><th>קשור אליי?</th><th>חוסם?</th></tr>${ev.map(e=>{const mine=e.symbol&&(openSyms.has(e.symbol)||watchSyms.has(e.symbol));return `<tr><td>${esc((e.symbol?e.symbol+' ':'')+e.title)}</td><td>${time(e.at)}</td><td>${e.impact==='HIGH'?'גבוהה':e.impact==='MEDIUM'?'בינונית':e.impact==='LOW'?'נמוכה':'לא ידועה'}</td><td>${mine?tag(openSyms.has(e.symbol)?'עסקה פתוחה':'Watchlist','amber'):'—'}</td><td>${e.blocksEntry?'🔒 כן':'לא'}</td></tr>`}).join('')}</table></div>`:empty('אין אירועים קרובים')}</div></div><details class=technicalDetails><summary>סיכום שוק טכני מלא</summary><pre style="white-space:pre-wrap;direction:rtl;text-align:right">${esc((b.text||'אין סיכום').replace('רוחב Universe הסריקה:','רוחב מדגם הסריקה המהירה:'))}</pre></details>`}
async function refreshBrief(){brief=await api('/api/market-brief/refresh',{method:'POST',body:'{}'});renderMarket()}async function refreshCalendar(){await api('/api/calendar/refresh',{method:'POST',body:'{}'});calendar=await api('/api/calendar');renderMarket()}async function addMacro(){const x=await askForm('הוסף אירוע מאקרו','הוסף אירוע שלא הופיע אוטומטית בלוחות הרשמיים.',[{name:'title',label:'שם האירוע',placeholder:'CPI / נאום יו״ר הפד'},{name:'at',label:'תאריך ושעה',type:'datetime-local'},{name:'impact',label:'רמת השפעה',type:'select',value:'HIGH',options:[{value:'HIGH',label:'גבוהה'},{value:'MEDIUM',label:'בינונית'},{value:'LOW',label:'נמוכה'}]}],'הוסף אירוע');if(!x)return;if(!x.title||!x.at)return toast('חובה למלא שם וזמן.','bad');await api('/api/calendar/macro',{method:'POST',body:JSON.stringify({title:x.title,at:new Date(x.at).toISOString(),impact:x.impact}),loadingLabel:'שומר אירוע…'});calendar=await api('/api/calendar',{silent:true});renderMarket()}
function renderPortfolio(){const x=intel||{},r=x.risk||{},corr=(x.correlations||[]).sort((a,b)=>(b.correlation??-2)-(a.correlation??-2)),oc=D.opportunitySnapshot?.opportunityCost||{},alts=oc.alternatives||[];$('view-portfolio').innerHTML=tabGuide('סיכון והקצאת הון','לא רק “האם יש מקום לעסקה”, אלא האם זו העסקה הטובה ביותר להשתמש בה בסיכון שנותר.','לפני פתיחת עסקה חדשה וכשיש כמה פוזיציות מתואמות.','סיכון פנוי, ריכוז, קורלציה, והאם Opportunity Cost מצדיק להוסיף דווקא את המניה הזאת.')+`<div class=hero><div class=row>${tag('Capital Preservation','green')}${oc.best?tag('Opportunity Cost פעיל','blue'):''}</div><h2>איזה סיכון שווה לקחת?</h2><p>עסקה טובה בפני עצמה יכולה להיות עסקה לא נכונה לתיק. v3 משווה גם Expected R ואמינות בין המועמדות הפעילות.</p></div><div class="grid metrics"><div class=metric><div class=label>סיכון פתוח</div><div class=value>${money(r.openRiskUsd)}</div></div><div class=metric><div class=label>סיכון מנוצל</div><div class=value>${r.usedPct??0}%</div></div><div class=metric><div class=label>סיכון פנוי</div><div class=value>${r.remainingPct??0}%</div></div><div class=metric><div class=label>פוזיציות</div><div class=value>${r.recordedTrades??0}</div></div><div class=metric><div class=label>קיבולת לעסקה רגילה</div><div class="value ${(r.remainingPct??0)>=(D.runtime?.defaultTradeRiskPct??.5)?'green':'red'}">${(r.remainingPct??0)>=(D.runtime?.defaultTradeRiskPct??.5)?'יש':'אין מספיק'}</div></div></div>${oc.best?`<div class=panel><div class=head><h3>השימוש הטוב ביותר כרגע בתקציב הסיכון</h3><div class=spacer></div>${tag('מבוסס מועמדות נוכחיות','blue')}</div><div class=body><div class=judgeBanner><div class=scoreRing>${oc.best.utility??'—'}</div><div><b class=ltr style="font-size:20px">${esc(oc.best.symbol)}</b><div class=sub>${esc(oc.note||'')}</div></div><div class=spacer></div>${btn('פתח תיק החלטה',`entry('${oc.best.symbol}')`,'primary')}</div>${alts.length?`<div class=tableWrap><table class=table><tr><th>מניה</th><th>Expected R</th><th>אמינות</th><th>Utility</th><th></th></tr>${alts.map(a=>`<tr><td><b class=ltr>${a.symbol}</b></td><td>${a.expectedR}R</td><td>${a.reliabilityPct}%</td><td>${a.utility}</td><td>${btn('בדוק',`entry('${a.symbol}')`)}</td></tr>`).join('')}</table></div>`:''}</div></div>`:''}<div class=decisionGrid><div><div class=panel><div class=head><h3>תרומת סיכון לפי פוזיציה</h3></div><div class=body>${(x.recordedTrades||[]).length?`<div class=tableWrap><table class=table><tr><th>מניה</th><th>סיכון $</th><th>סיכון %</th><th>גורמים</th></tr>${x.recordedTrades.map(t=>`<tr><td><b class=ltr>${t.symbol}</b></td><td>${money(t.riskUsd)}</td><td>${t.riskPct??'—'}%</td><td>${(t.factors||[]).map(f=>f==='UNCLASSIFIED'?tag('לא סווג','amber'):tag(f)).join(' ')}</td></tr>`).join('')}</table></div>`:empty('אין פוזיציות שבוצעו')}</div></div><div class=panel><div class=head><h3>אזהרות ריכוז</h3></div><div class=body>${(x.warnings||[]).map(w=>`<div class="notice warningBox" style="margin:6px 0">${esc(w)}</div>`).join('')||empty('אין כרגע אזהרת ריכוז מעל הסף')}</div></div></div><div><div class=panel><div class=head><h3>קורלציה בין פוזיציות</h3></div><div class=body>${corr.length?`<div class=tableWrap><table class=table><tr><th>זוג</th><th>קורלציה</th><th>פירוש</th></tr>${corr.map(c=>`<tr><td class=ltr>${c.a} / ${c.b}</td><td>${c.correlation??'—'}</td><td>${c.warning?tag('גבוהה — סיכון משותף','red'):tag('מתחת לסף','green')}</td></tr>`).join('')}</table></div>`:empty('צריך לפחות שתי פוזיציות עם היסטוריה')}</div></div><div class=panel><div class=head><h3>גורמי חשיפה</h3></div><div class=body>${(x.dominantFactors||[]).map(f=>`<div class=row style="padding:8px"><b>${f.factor==='UNCLASSIFIED'?'לא סווג':esc(f.factor)}</b><span>${f.symbols?.join(', ')}</span><div class=spacer></div>${money(f.riskUsd)}</div>`).join('')||empty('אין פוזיציות')}</div></div></div></div>`}
function renderJournal(){const j=journal||{},m=j.metrics||{},sh=j.shadowTrades||[],entries=j.entries||[];$('view-journal').innerHTML=tabGuide('יומן, Replay ומסחר צל','המסך שומר מה ידענו בזמן ההחלטה כדי להילחם ב-hindsight bias, ובמקביל עוקב אחרי עסקאות שנפסלו ו-A/B.','אחרי יום מסחר ובסקירה שבועית.','האם ההחלטה הייתה טובה לפי המידע שהיה אז — לא רק האם המניה עלתה אחר כך.')+`<div class=hero><div class=row>${tag('Anti-Hindsight','green')}${tag('Counterfactual','blue')}${tag('Shadow A/B','amber')}</div><h2>לומדים מהחלטות — גם מאלה שלא לקחנו</h2><p>Replay מפריד בין מה שהיה ידוע בזמן אמת לבין מידע שהגיע מאוחר יותר. כך לא מתקנים חוקים בגלל מזל או hindsight.</p><div>${btn('נתח את הביצועים שלי','coach()','primary')}${btn('פתח מעבדת החלטה',`go('learning')`,'blue')}</div></div>${coachData?`<div class=panel><div class=head><h3>מאמן המסחר</h3></div><div class=body>${(coachData.recommendations||[]).map(x=>`<div class=checkRow><span class="checkIcon good">→</span><span>${esc(x)}</span></div>`).join('')}</div></div>`:''}<div class="grid metrics"><div class=metric><div class=label>החלטות</div><div class=value>${m.decisions||0}</div></div><div class=metric><div class=label>Shadow שהסתיימו</div><div class=value>${m.shadowCompleted||0}</div></div><div class=metric><div class=label>Win Rate צל</div><div class=value>${m.winRate||0}%</div></div><div class=metric><div class=label>Avg R צל</div><div class=value>${m.avgR||0}</div></div></div><div class=panel><div class=head><h3>החלטות אחרונות — אפשר לשחזר</h3></div><div class=body>${entries.length?`<div class=tableWrap><table class=table><tr><th>זמן</th><th>מניה</th><th>מקור</th><th>פסק דין</th><th>ציון</th><th></th></tr>${entries.slice(0,50).map(e=>`<tr><td>${time(e.at)}</td><td><b class=ltr>${e.symbol}</b></td><td>${esc(e.source)}</td><td>${tag(he('verdict',e.verdict),/ENTER|READY/.test(e.verdict)?'green':/REJECT|NO_ENTRY/.test(e.verdict)?'red':'amber')}</td><td>${e.setupScore??'—'}/10</td><td>${btn('Decision Replay',`decisionReplayUi('${e.id}')`,'blue')}</td></tr>`).join('')}</table></div>`:ctaEmpty('עוד אין החלטות','הרץ סריקה או בדיקת כניסה כדי להתחיל לצבור Replay.','')}</div></div><div class=panel><div class=head><h3>עסקאות צל וניסויים</h3><div class=spacer></div><span class=sub>${sh.length} סה״כ</span></div><div class=body>${sh.length?`<div class=tableWrap><table class=table><tr><th>מניה</th><th>מטרה</th><th>וריאציה</th><th>תבנית</th><th>סטטוס</th><th>R</th></tr>${sh.slice(0,60).map(t=>`<tr><td><b class=ltr>${t.symbol}</b></td><td>${t.purpose==='COUNTERFACTUAL'?'פסילה שנבדקת':t.purpose==='AB_TEST'?'A/B':'אסטרטגיה'}</td><td>${t.abVariant??'—'}</td><td>${he('playbook',t.playbook||'NONE')}</td><td>${t.status==='WIN'?tag('ניצחה','green'):t.status==='LOSS'?tag('הפסידה','red'):t.status==='OPEN'?tag('פתוחה','blue'):t.status==='PENDING_TRIGGER'?tag('ממתינה','amber'):tag('פגה')}</td><td>${t.realizedR??'—'}</td></tr>`).join('')}</table></div>`:empty('אין עדיין עסקאות צל')}</div></div>`}
async function coach(){try{coachData=await api('/api/strategy/coach',{method:'POST',body:'{}',loadingLabel:'מנתח את הביצועים…'});renderJournal()}catch(e){toast('ניתוח הביצועים נכשל: '+e.message,'bad')}}
function alertCard(x){const sev=x.severity||'INFO',tone=sev.includes('STOP')||sev==='RISK'||sev==='INVALIDATED'?'red':sev.includes('TRIGGER')||sev==='TP_HIT'?'green':sev==='ARMED'?'amber':'blue';return `<div class="card ${x.read?'':'unreadAlert'}" style="margin-bottom:10px"><div class=row>${tag(he('severity',sev),tone)}${!x.read?tag('חדש','blue'):''}${x.symbol?`<b class=ltr>${esc(x.symbol)}</b>`:''}<b>${esc(x.title)}</b><div class=spacer></div><span class=sub>${time(x.at)}</span></div><div class=explainBox style="white-space:pre-wrap;line-height:1.65">${esc(x.message||'אין פירוט נוסף')}</div><div class=row>${!x.read?btn('סמן כנקראה',`markAlertUi('${x.id}')`):''}${x.symbol?btn('בדוק את המניה',`entry('${x.symbol}')`,'primary'):''}${x.tradeId?btn('פתח חדר עסקה',`openTradeRoom('${x.tradeId}')`,'blue'):''}</div>${x.metadata&&Object.keys(x.metadata).length?`<details class=technicalDetails><summary>נתונים טכניים של ההתראה</summary><pre class=sub style="white-space:pre-wrap;direction:ltr;text-align:left">${esc(JSON.stringify(x.metadata,null,2))}</pre></details>`:''}</div>`}
async function decisionReplayUi(id){try{const x=await api('/api/intelligence/replay?id='+encodeURIComponent(id),{loadingLabel:'משחזר את ההחלטה…'});if(!x||!x.decision)return toast('לא נמצא Replay.','bad');const d=x.decision,k=x.knownAtDecision||{},later=x.laterDecisions||[];showInfo(`Decision Replay — ${d.symbol}`,`מה היה ידוע בזמן ההחלטה (${time(d.at)}):\n\nפסק דין: ${d.verdict}\nציון: ${d.setupScore??'—'}/10\nביטחון: ${d.confidence??'—'}%\nתבנית: ${d.playbook??'—'}\nשוק: ${d.marketRegime??'—'}\n\nSnapshot שנשמר:\n${JSON.stringify(k,null,2)}\n\nמה נודע מאוחר יותר:\n${later.map(z=>`${time(z.at)} — ${z.verdict} · ${z.setupScore??'—'}/10`).join('\n')||'אין החלטות מאוחרות יותר'}\n\n${x.antiHindsightNote||''}`)}catch(e){toast('Replay נכשל: '+errHe(e),'bad')}}
function renderAlerts(){const a=alerts||{},s=automation?.status||{},fm=D.scanner?.fullMarket||{},ch=a.channels||{},rows=(a.alerts||[]).filter(x=>alertFilter==='ALL'||(alertFilter==='UNREAD'&&!x.read)||x.severity===alertFilter);$('view-alerts').innerHTML=tabGuide('התראות ואוטומציה','התראה טובה צריכה להגיד מה קרה, למה זה חשוב ומה עושים עכשיו. כאן גם רואים אם ערוצי המסירה באמת מוגדרים.','במהלך יום המסחר ובכל פעם שאתה רוצה לוודא שהמערכת פעילה.','התראות חדשות, Stop/TP, מצב האוטומציה, ערוצי Telegram/Webhook והתקדמות הסריקה.')+`<div class=hero><h2>התראות ואוטומציה</h2><p>סריקת מועמדות מהירה שונה מסריקת שוק מלאה; ניטור עסקאות וטריגרים ממשיך במסלול נפרד.</p><div class=row>${s.enabled?btn('עצור אוטומציה','automationToggle(false)','danger'):btn('הפעל אוטומציה','automationToggle(true)','primary')}${btn('סריקת מועמדות מהירה','bgScan()')}${btn('בדוק טריגרים עכשיו','pollNow()')}${btn('סמן הכול כנקרא','readAllAlerts()')}</div><div class=healthStrip>${tag('התראות באפליקציה: פעילות','green')}${tag('Telegram: '+(ch.telegram?'מחובר':'לא הוגדר'),ch.telegram?'green':'amber')}${tag('Webhook: '+(ch.webhook?'מחובר':'לא הוגדר'),ch.webhook?'green':'amber')}</div></div><div class="grid metrics"><div class=metric><div class=label>מצב אוטומציה</div><div class="value ${s.enabled?'green':'red'}">${s.enabled?'פעיל':'עצור'}</div></div><div class=metric><div class=label>סריקות מהירות היום</div><div class=value>${s.scansToday||0}</div></div><div class=metric><div class=label>התקדמות סבב מלא</div><div class=value>${fm.attemptedCoveragePct??fm.coveragePct??0}%</div><div class=sub>הצלחה ${fm.successCoveragePct??0}%</div></div><div class=metric><div class=label>לא נקראו</div><div class=value>${a.unread??0}</div></div><div class=metric><div class=label>כשלים בסבב מלא</div><div class=value>${fm.failures??0}</div></div></div><div class=panel><div class=head><h3>התראות אחרונות</h3><div class=spacer></div><select class=btn onchange="alertFilter=this.value;renderAlerts()"><option value=ALL ${alertFilter==='ALL'?'selected':''}>הכול</option><option value=UNREAD ${alertFilter==='UNREAD'?'selected':''}>רק חדשות</option><option value=TRIGGERED ${alertFilter==='TRIGGERED'?'selected':''}>טריגרים</option><option value=TP_HIT ${alertFilter==='TP_HIT'?'selected':''}>יעדים</option><option value=STOP_HIT ${alertFilter==='STOP_HIT'?'selected':''}>סטופים</option><option value=RISK ${alertFilter==='RISK'?'selected':''}>סיכון</option></select></div><div class=body>${rows.map(alertCard).join('')||empty('אין התראות שמתאימות למסנן')}</div></div>`}
async function markAlertUi(id){await api('/api/alerts/'+encodeURIComponent(id)+'/read',{method:'POST',body:'{}',silent:true});alerts=await api('/api/alerts',{silent:true});D.unreadAlerts=alerts.unread;renderNav();renderAlerts()}

async function syncHistoryUi(){const sym=($('dataSymbol')?.value||'').trim().toUpperCase();if(!sym)return toast('הזן קודם סימול במחקר החברה.','bad');try{const x=await api('/api/warehouse/sync',{method:'POST',body:JSON.stringify({symbol:sym,years:5}),timeoutMs:240000,loadingLabel:'מסנכרן היסטוריה חינמית…'});toast(`היסטוריית ${sym} סונכרנה: ${x.bars??x.count??'נתונים נשמרו'}.`,'good');freeData=await api('/api/intelligence/free-status',{silent:true});renderDataCenter(freeData);$('dataSymbol').value=sym}catch(e){toast('סנכרון היסטוריה נכשל: '+errHe(e),'bad')}}
async function runBacktestUi(){const sym=($('btSymbol')?.value||'').trim().toUpperCase(),pb=$('btPlaybook')?.value;if(!sym)return toast('הזן סימול ל-Backtest.','bad');try{const x=await api('/api/backtest',{method:'POST',body:JSON.stringify({symbol:sym,playbook:pb,years:5}),timeoutMs:240000,loadingLabel:'מריץ Backtest ו-Walk-Forward…'});const robust=x.robustness==='STRONG'?'חזק':x.robustness==='PROMISING'?'מבטיח':x.robustness==='WEAK'?'חלש':'אין מספיק נתונים';$('backtestResult').innerHTML=`<div class=hero><div class=row>${tag(robust,x.robustness==='STRONG'?'green':x.robustness==='WEAK'?'red':'amber')}${tag(`${x.bars} נרות יומיים`,'blue')}</div><h2>${esc(sym)} · ${esc(he('playbook',pb))}</h2><p>הבדיקה מחלקת את העסקאות כרונולוגית ל-70% Train ו-30% Test. החלק החשוב הוא לא רק שהעבר נראה טוב — אלא שגם ה-Test נשאר חיובי.</p></div><div class="grid metrics"><div class=metric><div class=label>כל המדגם</div><div class=value>${x.all.samples}</div><div class=sub>עסקאות</div></div><div class=metric><div class=label>Expectancy כולל</div><div class="value ${x.all.expectancyR>=0?'green':'red'}">${x.all.expectancyR}R</div></div><div class=metric><div class=label>Train</div><div class=value>${x.train.avgR}R</div><div class=sub>${x.train.winRatePct}% הצלחה</div></div><div class=metric><div class=label>Test מחוץ למדגם</div><div class=value>${x.test.avgR}R</div><div class=sub>${x.test.winRatePct}% הצלחה</div></div><div class=metric><div class=label>רצף הפסדים מקסימלי</div><div class=value>${x.all.maxLossStreak}</div></div></div>${x.warning?`<div class="notice warningBox">${esc(x.warning)}</div>`:''}`}catch(e){toast('Backtest נכשל: '+errHe(e),'bad')}}
function tabGuide(title,desc,when,look){return `<div class=tabIntro><div class=row>${tag('מדריך למסך','blue')}<h2>${title}</h2></div><p>${desc}</p><div class=tabHelp><div><b>מתי להשתמש במסך הזה?</b><span>${when}</span></div><div><b>על מה להסתכל?</b><span>${look}</span></div></div></div>`}function renderDecisionLab(x){const l=x.learning||{},rows=Object.values(l.stats||{}).sort((a,b)=>b.sampleSize-a.sampleSize),cal=x.calibration||{},cf=x.counterfactual||{},ab=x.ab||{},reg=x.regimes||{},buckets=Object.entries(cal.buckets||{}),regRows=Object.entries(reg).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.n-a.n);$('view-learning').innerHTML=tabGuide('מעבדת החלטה','כאן בודקים אם המנוע באמת לומד, אם ה-Confidence מכויל, אילו פסילות היו נכונות, ואיזה Ruleset עובד טוב יותר ב-Shadow A/B.','בסקירה שבועית, אחרי שינוי בחוקים, ואחרי שנצבר מדגם חדש.','Calibration, Expected R, Counterfactual misses, Regime performance ו-A/B — לא רק Win Rate.')+`<div class=hero><div class=row>${tag('ללא Black Box','green')}${tag('Walk-Forward + Calibration','blue')}${tag('Shadow A/B','amber')}</div><h2>מעבדת ההחלטה</h2><p>המטרה היא לא לגרום למערכת להרגיש חכמה — אלא למדוד אם כל שכבה באמת מוסיפה Expected Value. שום ניסוי לא משנה את חוקי Production אוטומטית.</p><div class=row>${btn('פתח יומן החלטות',`go('journal')`,'blue')}${btn('פתח מחקר ו-Backtest',`go('data')`)}</div></div><div class="grid metrics"><div class=metric><div class=label>דגימות Calibration</div><div class=value>${cal.samples??0}</div></div><div class=metric><div class=label>פסילות שנעקבו</div><div class=value>${cf.rejectedTracked??0}</div></div><div class=metric><div class=label>מנצחות שפספסנו</div><div class="value ${(cf.missedWinners??0)>0?'amber':''}">${cf.missedWinners??0}</div></div><div class=metric><div class=label>A/B שהסתיימו</div><div class=value>${(ab.variants?.A_BASE?.n??0)+(ab.variants?.B_TIGHTER_STOP?.n??0)}</div></div></div><div class=decisionGrid><div><div class=panel><div class=head><h3>כיול הסתברות</h3></div><div class=body>${buckets.length?`<div class=tableWrap><table class=table><tr><th>טווח שחזינו</th><th>דגימות</th><th>הצלחה בפועל</th><th>פירוש</th></tr>${buckets.map(([k,b])=>`<tr><td>${k}%</td><td>${b.n}</td><td>${b.actualPct}%</td><td>${b.n<5?'עדיין לא מספיק נתונים':Math.abs(b.actualPct-b.predictedMid)>12?tag('דורש Calibration','amber'):tag('מכויל סביר','green')}</td></tr>`).join('')}</table></div>`:ctaEmpty('אין עדיין מספיק Calibration','ככל שנסגור יותר החלטות עם outcome אמיתי, המערכת תוכל להקטין Overconfidence.','')}</div></div><div class=panel><div class=head><h3>Counterfactual — האם פסלנו נכון?</h3></div><div class=body>${cf.rejectedTracked?`<div class=dataStrip><div><small>פסילות שנבדקו</small><b>${cf.rejectedTracked}</b></div><div><small>פסילות נכונות</small><b>${cf.correctRejections}</b></div><div><small>מנצחות שפספסנו</small><b>${cf.missedWinners}</b></div><div><small>דיוק פסילה</small><b>${cf.correctPct}%</b></div></div>${(cf.byReason||[]).slice(0,8).map(r=>`<div class=checkRow><span class=checkIcon>↳</span><span><b>${esc(r.reason)}</b> · ${r.n} מקרים · ${r.missRatePct}% פספוס מנצחות</span></div>`).join('')}`:empty('עוד אין מספיק עסקאות שנפסלו והושלמו ב-Shadow.')}</div></div></div><div><div class=panel><div class=head><h3>Shadow A/B</h3></div><div class=body><div class=dataStrip><div><small>A — בסיס</small><b>${ab.variants?.A_BASE?.avgR??0}R</b><div class=sub>${ab.variants?.A_BASE?.n??0} דגימות</div></div><div><small>B — Stop מעט הדוק יותר</small><b>${ab.variants?.B_TIGHTER_STOP?.avgR??0}R</b><div class=sub>${ab.variants?.B_TIGHTER_STOP?.n??0} דגימות</div></div></div><p class=sub>${esc(ab.note||'')}</p></div></div><div class=panel><div class=head><h3>ביצועים לפי Regime + Playbook</h3></div><div class=body>${regRows.length?`<div class=tableWrap><table class=table><tr><th>תבנית / מצב שוק</th><th>דגימות</th><th>Win Rate</th><th>Avg R</th></tr>${regRows.slice(0,16).map(r=>`<tr><td>${esc(r.key)}</td><td>${r.n}</td><td>${r.n?Math.round(r.wins/r.n*100):0}%</td><td class="${r.avgR>=0?'green':'red'}">${r.avgR}R</td></tr>`).join('')}</table></div>`:empty('צריך עסקאות סגורות עם Market Regime כדי למדוד ביצועים לפי מצב שוק.')}</div></div></div></div><div class=panel><div class=head><h3>למידה אדפטיבית לפי תבנית</h3></div><div class=body>${rows.length?`<div class=tableWrap><table class=table><tr><th>תבנית</th><th>אמיתיות</th><th>צל</th><th>משקל אפקטיבי</th><th>הצלחה</th><th>R ממוצע</th><th>השפעה</th></tr>${rows.map(r=>`<tr><td>${esc(he('playbook',r.playbook))}</td><td>${r.realSamples??0}</td><td>${r.shadowSamples??0}</td><td>${r.effectiveSamples??r.sampleSize}</td><td>${r.winRate}%</td><td>${r.avgR}R</td><td class="${r.adjustment<0?'red':'green'}">${r.adjustment>0?'+':''}${r.adjustment}</td></tr>`).join('')}</table></div>`:empty('עוד אין מספיק נתונים ללמידה.')}</div></div><div class=panel><div class=head><h3>Rule Lab — השוואה לפני שינוי Production</h3></div><div class=body><div class=row><input id=ruleSymbol placeholder="ANET"><select id=rulePlaybook><option value=BREAKOUT>פריצה</option><option value=PULLBACK>Pullback</option><option value=RELATIVE_STRENGTH_BREAKOUT>פריצה עם חוזק יחסי</option><option value=TREND_RECLAIM>Trend Reclaim</option><option value=VOLATILITY_SQUEEZE>Squeeze</option></select>${btn('השווה וריאציות','runRuleLab()','primary')}</div><div id=ruleLabResult style="margin-top:12px">${empty('השינוי לא מקודם אוטומטית. קודם Backtest, אחר כך Shadow A/B, ורק אז החלטת Production.')}</div></div></div>`}
async function runRuleLab(){const symbol=($('ruleSymbol')?.value||'').trim().toUpperCase(),playbook=$('rulePlaybook')?.value;if(!symbol)return toast('הזן סימול ל-Rule Lab.','bad');try{const x=await api('/api/rule-lab/compare',{method:'POST',body:JSON.stringify({symbol,playbook}),loadingLabel:'משווה Rulesets…'}),v=x.variants||{};$('ruleLabResult').innerHTML=`<div class=dataStrip>${Object.entries(v).map(([k,m])=>`<div><small>${esc(k)}</small><b class="${m.avgR>=0?'green':'red'}">${m.avgR}R</b><div class=sub>${m.samples} דגימות · ${m.winRatePct}% הצלחה</div></div>`).join('')}</div><p class=sub>${esc(x.warning||'')}</p>`}catch(e){toast('Rule Lab נכשל: '+errHe(e),'bad')}}
function renderRules(){const r=rules||{},cfg=D.runtime||{};$('view-rules').innerHTML=tabGuide('חוקת המסחר ומבנה ההחלטה','החוקים הקשיחים נשארים מעל כל Score. ועדת הראיות, Backtest ולמידה יכולים לשנות דירוג — לא לעקוף Stop, R:R או סיכון תיק.','כשאתה רוצה להבין למה עסקה נחסמה או מה בדיוק המערכת שוקלת.','Hard Gates קודם; אחריהם ועדת מומחים; אחר כך Judge; ורק לבסוף הקצאת הון.')+`<div class=hero><div class=row>${tag('v3 Evidence-Driven','green')}${tag('Zero-AI','blue')}${tag('Hard Gates > Scores','amber')}</div><h2>איך Trader OS חושבת?</h2><p>Price structure, Volume, Market, Sector, SEC, Fundamentals, Data Quality, Historical Analogs ו-Execution נחשבים קבוצות ראיה נפרדות. אינדיקטורים שמספרים אותו סיפור אינם נספרים שוב ושוב כאילו הם ראיות עצמאיות.</p></div><div class="grid metrics"><div class=metric><div class=label>שווי תיק</div><div class=value>${money(cfg.accountValueUsd)}</div></div><div class=metric><div class=label>סיכון לעסקה</div><div class=value>${cfg.defaultTradeRiskPct??0.5}%</div></div><div class=metric><div class=label>סיכון לתיק</div><div class=value>${cfg.maxPortfolioRiskPct??3}%</div></div><div class=metric><div class=label>Setup מינימלי</div><div class=value>${cfg.minOpportunityScore??6.5}/10</div></div><div class=metric><div class=label>R:R מינימלי</div><div class=value>1:${cfg.minOpportunityRR??2}</div></div><div class=metric><div class=label>אמינות מידע</div><div class=value>${cfg.minDataConfidenceScore??70}%+</div></div><div class=metric><div class=label>Spread מקסימלי</div><div class=value>${cfg.maxExecutionSpreadPct??0.8}%</div></div></div><div class=panel><div class=head><h3>צינור ההחלטה של v3</h3></div><div class=body><div class=dataStrip><div><small>1</small><b>Hard Gates</b><div class=sub>נתונים · Stop · R:R · Event · Portfolio</div></div><div><small>2</small><b>Evidence Committee</b><div class=sub>מומחים עצמאיים תומכים/מתנגדים</div></div><div><small>3</small><b>Devil's Advocate</b><div class=sub>מחפש למה לא לקחת</div></div><div><small>4</small><b>Judge</b><div class=sub>ENTER / ARMED / WAIT / REJECT / UNCERTAIN</div></div><div><small>5</small><b>Capital Allocation</b><div class=sub>Expected R × Reliability מול חלופות</div></div></div></div></div><div class="grid cards"><div class=card><h3>עקרונות קשיחים</h3>${(r.principles||[]).map(x=>`<p class=sub>• ${esc(x)}</p>`).join('')}</div><div class=card><h3>תהליך בסיס</h3>${(r.decisionProcess||[]).map((x,i)=>`<p class=sub>${i+1}. ${esc(x)}</p>`).join('')}</div><div class=card><h3>תנאי חובה</h3>${(r.entryGate?.mustHave||[]).map(x=>`<p class=sub>✓ ${esc(x)}</p>`).join('')}<p class=sub>✓ איכות נתונים לפחות ${cfg.minOpportunityDataQuality??75}%</p></div><div class=card><h3>שכבות v3 שלא עוקפות Gates</h3><p class=sub>• Historical Analogs + Calibration</p><p class=sub>• FINRA / FTD / Reg SHO / Halts</p><p class=sub>• Options Indicative כ-Context בלבד</p><p class=sub>• Counterfactual + Shadow A/B</p><p class=sub>• Thesis Monitor + Decision Replay</p></div></div><div class="notice goodBox"><b>המערכת רשאית להגיד “לא יודעת”.</b> מצב חריג מחוץ למדגם, סתירת מקורות או Evidence לא עקבי מובילים ל-UNCERTAIN/WAIT — לא ל-Confidence מזויף.</div>`}
renderNav();
$('view-dashboard').innerHTML=skeleton();
loadBase(true).catch(e=>{
  $('statusPill').textContent='שגיאת טעינה';
  $('view-dashboard').innerHTML=ctaEmpty('לא הצלחתי לטעון את הסקירה',errHe(e),btn('נסה שוב','loadBase(true)','primary'));
});
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
